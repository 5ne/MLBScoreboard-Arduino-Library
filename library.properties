name=MLBScoreboard
version=0.1.0
author=5ne
maintainer=5ne
sentence=Display live MLB scores on Inkplate e-paper boards (Inkplate 2 and larger).
paragraph=Fetches game data from the MLB Stats API and renders it on any Inkplate board. Ships a compact single-game renderer for the tiny 3-color Inkplate 2 and a multi-game grid renderer for larger grayscale/color Inkplate boards. Handles WiFi, adaptive polling (slower pregame, fast during live games, stopped once final), and deep-sleep scheduling for battery-powered installs.
category=Display
