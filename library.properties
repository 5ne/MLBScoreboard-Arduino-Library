name=MLBScoreboard
version=0.1.1
author=5ne
maintainer=5ne
sentence=Display live MLB scores on Inkplate e-paper boards (Inkplate 2 and larger).
paragraph=Fetches game data from the MLB Stats API into a simple struct, and separately ships Inkplate renderers to draw it: a compact single-game renderer for the tiny 3-color Inkplate 2, and a multi-game grid renderer for larger grayscale/color Inkplate boards. The data-fetching class (MLBScoreboard) handles WiFi, adaptive polling (slower pregame, fast during live games, stopped once final), and deep-sleep scheduling for battery-powered installs, and has no dependency on Inkplate or any display code -- pairing it with a renderer is left to your sketch.
category=Display
url=https://github.com/5ne/MLBScoreboard-Arduino-Library
architectures=esp32
depends=InkplateLibrary, ArduinoJson
includes=MLBScoreboard.h
